<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kisan Portal</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#f6f9f3}
.hero{
    max-width:1200px;
    margin:30px auto;
    border-radius:20px;
    overflow:hidden;
    background:#fff;
}

.slider{
    width:100%;
    height:550px;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#fff;
}

.slider img{
    width:100%;
    height:100%;
    object-fit:contain;
    display:none;
}
.section{max-width:1200px;margin:50px auto;padding:0 20px}
.section h2{text-align:center;color:#2d6a4f;margin-bottom:30px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:22px}
.card{text-decoration:none;color:#333;background:#fff;border-radius:16px;padding:24px;text-align:center;box-shadow:0 8px 20px rgba(0,0,0,.08);transition:.3s}
.card:hover{transform:translateY(-8px);background:#2d6a4f;color:#fff}
.card img{width:90px;height:90px;object-fit:contain;margin-bottom:15px}
.features{background:#2d6a4f;padding:60px 0}
.features h2{color:#fff}
@media(max-width:768px){.slider{height:250px}}
</style>
</head>
<body>

{% include 'header.html' %}

<div class="hero">
<div class="slider">
<img src="/static/images/f1.png" alt="" />
<img src="/static/images/f2.png" alt="" />
<img src="/static/images/f3.png" alt="" />
</div>
</div>

<section class="section">
<h2>Explore Services</h2>
<div class="grid">
<a class="card" href="/mainpages/weather"><img src="/static/images/weather.png"><h3>Weather</h3></a>
<a href="/mainpages/government_schemes" class="card"> <div class="icon">🏛</div>

    <h3>Government Schemes</h3>
    <p>
        Explore Central and State Government
        schemes for farmers.
    </p>
</a>
</div>
</section>

<section class="features">
<div class="section">
<h2>AI Powered Features</h2>
<div class="grid">
<a class="card" href="/mainpages/fertilizer"><img src="/static/images/fertilizer_prediction.png"><h3>Fertilizer Prediction</h3></a>



<a class="card" href="/mainpages/crop_predict"><img src="/static/images/crop_prediction.jfif"><h3>Crop Prediction</h3></a>
<a class="card" href="/mainpages/farm_talk"><img src="/static/images/chat_boat.jfif"><h3>Farm Buddy Talk</h3></a>
</div>
</div>
</section>

{% include 'footer.html' %}

<script>
const slides=document.querySelectorAll('.slider img');
let c=0;
slides[c].style.display='block';
setInterval(()=>{
slides[c].style.display='none';
c=(c+1)%slides.length;
slides[c].style.display='block';
},3000);
</script>

</body>
</html>
