<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agriculture Website</title>
    <style>
        /* Basic styling for the footer */
        footer {
            background-color: #d0cdcd;
            padding: 20px;
            text-align: center;
        }

        /* Style for footer links */
        footer a {
            color: #333;
            text-decoration: none;
            margin: 0 10px;
        }

        /* Style for mission and vision sections */
        .mission,
        .vision {
            margin-bottom: 20px;
        }

        /* Style for social media icons */
        .social-icons {
            margin-top: 10px;
        }

        .social-icons a {
            display: inline-block;
            margin-right: 10px;
            font-size: 20px;
            color: #333;
        }
    </style>
</head>
<body>
    <!-- Your website content goes here -->

    <!-- Footer section -->
    <footer>
        <div class="mission">
            <h3>Mission</h3>
            <p>Empowering farmers through sustainable practices and innovation.</p>
        </div>
        <div class="vision">
            <h3>Vision</h3>
            <p>Becoming a global leader in agricultural excellence.</p>
        </div>
        <div class="social-icons">
            <a href="#"><i class="fab fa-facebook"></i></a>
            <a href="#"><i class="fab fa-twitter"></i></a>
            <a href="#"><i class="fab fa-instagram"></i></a>
            <!-- Add more social media icons as needed -->
        </div>
        <p>© 2024 Agriculture Farm. All rights reserved.</p>
    </footer>
</body>
</html>
