<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FarmBuddy</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

header{
    position:sticky;
    top:0;
    z-index:1000;
    background:#8BC34A;
    box-shadow:0 2px 10px rgba(0,0,0,.12);
}

.top-bar{
    height:10px;
    background:#d9ecff;
}

.navbar{
    max-width:1200px;
    margin:auto;
    padding:16px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
}

.brand{
    display:flex;
    align-items:center;
    gap:14px;
}

.brand img{
    width:70px;
    height:70px;
    object-fit:contain;
}

.brand h2{
    color:#fff;
}

.brand p{
    color:#eef7e9;
    font-size:14px;
}

.nav-links{
    display:flex;
    list-style:none;
    gap:25px;
    align-items:center;
}

.nav-links a{
    text-decoration:none;
    color:#fff;
    font-weight:600;
    font-size:16px;
    transition:.3s;
}

.nav-links a:hover{
    color:#ffeb3b;
}

.search-box{
    display:flex;
}

.search-box input{
    padding:10px 12px;
    border:none;
    border-radius:8px 0 0 8px;
    width:220px;
    outline:none;
}

.search-box button{
    padding:10px 16px;
    border:none;
    background:#2e7d32;
    color:#fff;
    border-radius:0 8px 8px 0;
    cursor:pointer;
}

.dropdown{
    position:relative;
}

.dropbtn{
    color:#fff;
    font-size:22px;
    text-decoration:none;
    padding:8px;
}

.dropdown-content{
    display:none;
    position:absolute;
    right:0;
    top:36px;
    background:#fff;
    min-width:180px;
    border-radius:10px;
    box-shadow:0 8px 20px rgba(0,0,0,.15);
    overflow:hidden;
}

.dropdown-content a{
    display:block;
    padding:12px 16px;
    color:#333;
    text-decoration:none;
}

.dropdown-content a:hover{
    background:#f5f5f5;
}

.dropdown:hover .dropdown-content{
    display:block;
}

.notice{
    background:#ffd54f;
    padding:8px;
    text-align:center;
    font-weight:600;
    color:#333;
}

@media(max-width:900px){

.navbar{
    flex-direction:column;
}

.nav-links{
    flex-wrap:wrap;
    justify-content:center;
}

.search-box input{
    width:170px;
}

}
</style>
</head>

<body>

<header>

<div class="top-bar"></div>

<div class="navbar">

<div class="brand">
<img src="{{ url_for('static', filename='FarmBuddy.png') }}" alt="FarmBuddy">

<div>
<h2>FarmBuddy</h2>
<p>Makes farming easy for you</p>
</div>

</div>

<ul class="nav-links">

<li><a href="/">🏠 Home</a></li>

<li><a href="/mainpages/weather">🌦 Weather</a></li>

<li><a href="/mainpages/crop_predict">🌾 Crop</a></li>

<li><a href="/mainpages/fertilizer">🧪 Fertilizer</a></li>

<li><a href="/mainpages/farm_talk">🤖 FarmTalk</a></li>

<li><a href="/mainpages/government_schemes">🏛 Schemes</a></li>

</ul>

<form class="search-box">

<input
type="text"
placeholder="Search..."
>

<button type="submit">
Search
</button>

</form>

</div>

<div class="notice">
🌱 Welcome to FarmBuddy | Smart Farming Starts Here
</div>

</header>
