<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crop Recommendation - ML Model</title>
    <link rel="stylesheet" href="static/style.css">

    <style>
        /* CSS to style the form */
        body, html {
            height: 100%;
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
        }
        
        .container {
            width: 400px; /* Fixed width */
            padding: 20px;
            border: 2px solid #ccc;
            border-radius: 8px;
            text-align: center;
            margin-left: 550px;
            margin-top:20px;
        }

        h1 {
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }

        label {
            display: block;
            font-weight: bold;
        }

        input[type="number"], select {
            width: calc(100% - 20px);
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        button[type="submit"], button[type="button"] {
            width: calc(100% - 10px);
            padding: 10px;
            margin-top: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button[type="submit"]:hover, button[type="button"]:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <centre>
    <div class="container">
        <h1>Crop Recommendation - ML Model</h1><br>
        <form id="inputForm" method="post" action="/predict">
            <div class="form-group">
                <label for="N">Nitrogen Value in soil (N): </label>
                <input type="number" name="N" id="N" min="0" max="140" step="any" required>
            </div>
            <div class="form-group">
                <label for="P">Phosphorus Value in soil (P):</label>
                <input type="number" name="P" id="P" min="5" max="145" step="any" required>
            </div>
            <div class="form-group">
                <label for="K">Potassium Value in soil (K):</label>
                <input type="number" name="K" id="K" min="5" max="205" step="any" required>
            </div>
            <div class="form-group">
                <label for="temperature">Temperature (°C):</label>
                <input type="number" name="temperature" id="temperature" min="-50" max="50" step="any" required>
            </div>
            <div class="form-group">
                <label for="humidity">Humidity (%):</label>
                <input type="number" name="humidity" id="humidity" min="0" max="100" step="any" required>
            </div>
            <div class="form-group">
                <label for="ph">PH Value:</label>
                <input type="number" name="ph" id="ph" min="0" max="15" step="any" required>
            </div>
            <div class="form-group">
                <label for="rainfall">Rainfall (mm):</label>
                <input type="number" name="rainfall" id="rainfall" min="20" max="300" step="any" required>
            </div>
            <button type="submit">Submit</button>
            <button type="button" onclick="clearForm()">Clear Form</button>
        </form>
        <div id="result"></div>
    </div>
</centre>

    <script src="static/script.js"></script>
</body>
</html>
